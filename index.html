<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Интерактивная карта</title>

  <style>
    body {
      margin: 0;
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    .map-container {
      position: relative;
      width: 1000px;
      height: 800px;
      background: #000;
    }

    .map-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    .point {
      position: absolute;
      width: 64px;
      height: 64px;
      cursor: pointer;
      background-size: auto auto;
      background-repeat: no-repeat;
      background-position: 0% 0%;
    }

    .point:hover {
      z-index: 0;
    }

    .type-1 {
      background-image: url('./que1.png');
    }

    .type-2 {
      background-image: url('./que2.png');
    }

    .type-3 {
      background-image: url('./que3.png');
    }

    .type-4 {
      background-image: url('./sov.png');
    }
	
	 .type-5 {
      background-image: url('./emp.png');
    }
	
	 .type-6 {
      background-image: url('./udel.png');
    }

	 .type-7 {
      background-image: url('./spqr.png');
    }
	
	 .type-8 {
      background-image: url('./newest.png');
    }
	
	 .type-9 {
      background-image: url('./19.png');
    }
	
    .tooltip {
      position: absolute;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 18px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      white-space: nowrap;
      z-index: 999;
    }
  </style>
</head>
<body>

  <div class="map-container" id="map">
    <img src="./map.png" alt="Карта" class="map-image" />

    <div class="tooltip" id="tooltip"></div>
  </div>

  <script>
    const map = document.getElementById('map');
    const tooltip = document.getElementById('tooltip');

    const points = [
      {
        id: 1,
        x: 433,
        y: 618,
        type: 'type-1',
        title: 
		'Выберите одну из предложенных тем (периодов) из двух областей: История России и Зарубежная история.'
      },
      {
        id: 2,
        x: 428,
        y: 299,
        type: 'type-2',
        title: 'Сформулируйте проблему для выбранных вами тем. На основе проблемы задайте цель своего проекта.'
      },
      {
        id: 3,
        x: 272,
        y: 38,
        type: 'type-3',
        title: 'На основе цели сформулируйте по три или более задачи, требующиеся для реализации цели проекта.'
      },
      {
        id: 4,
        x: 136,
        y: 696,
        type: 'type-4',
        title: 'Советский период (1917-1991 гг.)'
		},
      {
        id: 5,
        x: 136,
        y: 640,
        type: 'type-5',
        title: 'Российское царство - Российская империя (XVI в. - 1917 г.)'
      },
      {
        id: 6,
        x: 136,
        y: 582,
        type: 'type-6',
        title: 'Удельный период (1132 г. - XVI в.)'
	  },
      {
        id: 7,
        x: 786,
        y: 582,
        type: 'type-7',
        title: 'Античность (V в. до н. э. - V в. н. э.)'
      },
      {
        id: 8,
        x: 786,
        y: 708,
        type: 'type-8',
        title: 'Новейшее время (1918-1991 гг.)'
	  },
      {
        id: 9,
        x: 786,
        y: 643,
        type: 'type-9',
        title: 'XIX век'
      }
    ];

    function createPoint(pointData) {
      const point = document.createElement('div');

      point.classList.add('point', pointData.type);

      point.style.left = `${pointData.x}px`;
      point.style.top = `${pointData.y}px`;

      point.addEventListener('mouseenter', (e) => {
        tooltip.textContent = pointData.title;
        tooltip.style.opacity = '1';
      });

      point.addEventListener('mousemove', (e) => {
        const rect = map.getBoundingClientRect();

        tooltip.style.left = `${e.clientX - rect.left + 15}px`;
        tooltip.style.top = `${e.clientY - rect.top + 15}px`;
      });

      point.addEventListener('mouseleave', () => {
        tooltip.style.opacity = '0';
      });

      map.appendChild(point);
    }

    points.forEach(createPoint);
  </script>

</body>
</html>
